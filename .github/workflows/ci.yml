name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: active-go
      - uses: actions/checkout@v5
        with:
          repository: Active-Official/active
          path: active
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: active-go/go.sum
      - name: Vet
        working-directory: active-go
        run: go vet ./...
      - name: Conformance against shared manifest
        working-directory: active-go
        env:
          ACTIVE_CONFORMANCE_DIR: ${{ github.workspace }}/active/conformance
        run: go test ./... -v -count=1
